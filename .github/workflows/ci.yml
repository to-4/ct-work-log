name: Laravel PHPUnit CI (Docker + .env.testing)

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. コード取得
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. Docker Compose バージョン確認（オプション）
      - name: Check Docker Compose
        run: docker compose version

      # 3. Build and start containers
      - name: Docker Compose up
        run: docker compose up -d --build

      # 4. Install composer vendor
      - name: Install dependencies (composer install)
        run: |
          cd src
          composer install --no-interaction --prefer-dist --no-progress

      # 5. .env.testing を作成
      - name: Prepare testing environment
        run: |
          cp src/.env.testing.example src/.env.testing
          docker compose exec php php artisan key:generate --env=testing

      # 6. DBの起動待ち（MySQL準備完了まで）
      - name: Wait for MySQL to be ready
        run: |
          until docker exec $(docker ps -qf "name=mysql") mysqladmin ping -h"mysql" --silent; do
            echo "Waiting for database connection..."
            sleep 5
          done

      # 7. PHPUnit テスト実行
      - name: Run PHPUnit tests
        run: docker compose exec php vendor/bin/phpunit

      # 8. 後片付け（停止・削除）
      - name: Tear down containers
        if: always()
        run: docker compose down -v
